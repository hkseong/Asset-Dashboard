<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 자산">
<meta name="robots" content="noindex">
<title>내 자산</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1b1f27; --sub: #6b7280; --line: #e4e7ec;
    --up: #e0393e; --down: #2b6fe0; --total: #1b1f27; --avg: #f29d0f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --panel: #1b1e24; --ink: #eceef2; --sub: #8b93a1; --line: #2a2e36;
      --up: #ff5a5f; --down: #4c8dff; --total: #eceef2; --avg: #ffb02e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-feature-settings: "tnum"; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  section { background: var(--panel); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  h2 { font-size: 15px; font-weight: 650; margin: 0 0 12px; }

  .hero .asof { color: var(--sub); font-size: 13px; }
  .hero .total { font-size: clamp(32px, 8vw, 44px); font-weight: 750; letter-spacing: -0.02em; margin: 4px 0 2px; }
  .hero .pl { font-size: 17px; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .stats div { font-size: 13px; color: var(--sub); }
  .stats b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; margin-top: 2px; }

  .chart { height: 300px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--sub); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
  .chips button {
    flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink);
    padding: 7px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chips button.sold { color: var(--sub); }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .tinfo { font-size: 13px; color: var(--sub); margin-bottom: 8px; min-height: 18px; }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--sub); font-weight: 500; font-size: 12px; }
  tbody tr { cursor: pointer; }
  .up { color: var(--up); } .down { color: var(--down); }
  .msg { text-align: center; color: var(--sub); padding: 80px 0; }

  .lock { max-width: 320px; margin: 18vh auto 0; text-align: center; }
  .lock h1 { font-size: 20px; font-weight: 700; margin: 0 0 18px; }
  .lock input[type="password"] {
    width: 100%; font: inherit; font-size: 22px; letter-spacing: 0.4em; text-align: center;
    padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
  }
  .lock input[type="password"]:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .lock label { display: block; margin: 12px 0 16px; font-size: 13px; color: var(--sub); }
  .lock button {
    width: 100%; font: inherit; font-size: 16px; font-weight: 600; padding: 13px; border: 0; border-radius: 12px;
    background: var(--ink); color: var(--panel); cursor: pointer;
  }
  .lock .err { color: var(--up); font-size: 13px; min-height: 18px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <form id="lock" class="lock" hidden>
    <h1>내 자산</h1>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
    <label><input id="remember" type="checkbox" checked> 이 기기에서 기억하기</label>
    <button type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div id="msg" class="msg" hidden>불러오는 중…</div>

  <div id="app" hidden>
    <section class="hero">
      <div class="asof" id="asof"></div>
      <div class="total" id="total"></div>
      <div class="pl" id="pl"></div>
      <div class="stats">
        <div>투입 원금<b id="principal"></b></div>
        <div>주식 평가액<b id="val"></b></div>
        <div>예수금<b id="cash"></b></div>
      </div>
    </section>

    <section>
      <h2>자산 추이</h2>
      <div class="chart" id="chartTotal"></div>
      <div class="legend"><span><i style="background:var(--total)"></i>총자산</span><span><i style="background:var(--sub)"></i>투입 원금</span></div>
    </section>

    <section>
      <h2>종목별 차트</h2>
      <div class="chips" id="chips"></div>
      <div class="tinfo" id="tinfo"></div>
      <div class="chart" id="chartTicker"></div>
      <div class="legend"><span><i style="background:var(--avg)"></i>내 평단</span><span>▲ 매수 ▼ 매도</span></div>
    </section>

    <section>
      <h2>보유 종목</h2>
      <div class="tablewrap">
        <table>
          <thead><tr><th>종목</th><th>수량</th><th>평단</th><th>현재가</th><th>평가액</th><th>손익</th><th>수익률</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const num = s => +String(s ?? '').replace(/,/g, '') || 0;
const won = n => Math.round(n).toLocaleString('ko-KR');
const signed = n => (n > 0 ? '+' : '') + won(n);
const pct = n => (n > 0 ? '+' : '') + (n * 100).toFixed(2) + '%';
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : '';

// 거래 원장을 처음부터 재생해서 일자별 상태를 복원
function compute(raw) {
  const names = Object.fromEntries(raw.tickers.map(r => [r[0], r[1]]));
  const trades = raw.trades.map(r => ({
    d: r[0], t: r[1].trim(), code: r[2].trim(), q: num(r[4]), p: num(r[5]),
    a: num(r[6]) || num(r[4]) * num(r[5]), fee: num(r[7]), tax: num(r[8])
  })).sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0); // 같은 날은 시트 행 순서 유지

  const px = {};
  raw.prices.forEach(r => { (px[r[1]] ??= {})[r[0]] = [+r[2], +r[3], +r[4], +r[5]]; });
  const start = trades[0].d;
  const cal = [...new Set(raw.prices.map(r => r[0]))].filter(d => d >= start).sort();

  const pos = {}, last = {}, avgLine = {}, marks = {};
  let cash = 0, principal = 0, income = 0;
  const apply = tr => {
    const { t, code, q, a, fee, tax, d } = tr;
    if (t === '매수' || t === '매도') {
      const p = pos[code] ??= { q: 0, avg: 0, realized: 0 };
      const m = ((marks[code] ??= {})[d] ??= { b: 0, s: 0 });
      if (t === '매수') {
        p.avg = (p.avg * p.q + a) / (p.q + q); p.q += q; cash -= a + fee; m.b += q;
      } else {
        p.realized += a - fee - tax - p.avg * q; p.q -= q; if (p.q <= 0) { p.q = 0; p.avg = 0; }
        cash += a - fee - tax; m.s += q;
      }
    } else if (t === '입금') { cash += a; principal += a; }
    else if (t === '출금') { cash -= a; principal -= a; }
    else if (t === '분배금' || t === '이자') { cash += a; income += a; }
    else if (t === '세금') { cash -= a; }
  };

  const series = [];
  let i = 0;
  for (const d of cal) {
    while (i < trades.length && trades[i].d <= d) apply(trades[i++]);
    let val = 0;
    for (const c in px) if (px[c][d]) last[c] = px[c][d][3];
    for (const c in pos) {
      if (pos[c].q) val += pos[c].q * (last[c] ?? pos[c].avg);
      (avgLine[c] ??= []).push(pos[c].q ? { time: d, value: pos[c].avg } : { time: d });
    }
    series.push({ time: d, total: val + cash, principal, val, cash });
  }
  while (i < trades.length) apply(trades[i++]); // 시세 마지막 날짜 이후 거래 반영

  const holdings = Object.entries(pos).filter(([, p]) => p.q > 0).map(([c, p]) => {
    const price = last[c] ?? p.avg, ev = p.q * price, cost = p.q * p.avg;
    return { code: c, name: names[c] || c, q: p.q, avg: p.avg, price, ev, pl: ev - cost, r: (ev - cost) / cost };
  }).sort((a, b) => b.ev - a.ev);

  const val = holdings.reduce((s, h) => s + h.ev, 0);
  return { names, px, pos, series, avgLine, marks, holdings, cash, principal, income, val, asof: cal[cal.length - 1] };
}

function baseChart(el) {
  return LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { type: 'solid', color: 'transparent' }, textColor: css('--sub'), fontFamily: 'Pretendard Variable, sans-serif' },
    grid: { vertLines: { visible: false }, horzLines: { color: css('--line') } },
    rightPriceScale: { borderVisible: false },
    timeScale: { borderVisible: false },
    localization: { priceFormatter: p => won(p) },
    handleScroll: { vertTouchDrag: false },
  });
}

let S, tickerChart, candle, avgSeries;

function render(S) {
  const total = S.val + S.cash, profit = total - S.principal, rate = profit / S.principal;
  $('asof').textContent = S.asof + ' 종가 기준 총자산';
  $('total').textContent = won(total) + '원';
  $('pl').textContent = signed(profit) + '원 (' + pct(rate) + ')';
  $('pl').className = 'pl ' + cls(profit);
  $('principal').textContent = won(S.principal) + '원';
  $('val').textContent = won(S.val) + '원';
  $('cash').textContent = won(S.cash) + '원';

  // 자산 추이
  const tc = baseChart($('chartTotal'));
  tc.addLineSeries({ color: css('--sub'), lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false })
    .setData(S.series.map(s => ({ time: s.time, value: s.principal })));
  tc.addLineSeries({ color: css('--total'), lineWidth: 2, priceLineVisible: false })
    .setData(S.series.map(s => ({ time: s.time, value: s.total })));
  tc.timeScale().fitContent();

  // 보유 종목 표
  $('rows').innerHTML = S.holdings.map(h => `
    <tr data-code="${h.code}">
      <td>${h.name}</td><td>${h.q}</td><td>${won(h.avg)}</td><td>${won(h.price)}</td>
      <td>${won(h.ev)}</td><td class="${cls(h.pl)}">${signed(h.pl)}</td><td class="${cls(h.r)}">${pct(h.r)}</td>
    </tr>`).join('');
  document.querySelectorAll('#rows tr').forEach(tr => tr.onclick = () => {
    showTicker(tr.dataset.code);
    $('chartTicker').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // 종목 선택 칩: 보유 중 → 매도 완료 순
  const held = S.holdings.map(h => h.code);
  const sold = Object.keys(S.pos).filter(c => !held.includes(c));
  $('chips').innerHTML = [...held, ...sold].map(c =>
    `<button data-code="${c}" class="${held.includes(c) ? '' : 'sold'}" aria-pressed="false">${S.names[c] || c}</button>`).join('');
  document.querySelectorAll('#chips button').forEach(b => b.onclick = () => showTicker(b.dataset.code));

  tickerChart = baseChart($('chartTicker'));
  candle = tickerChart.addCandlestickSeries({
    upColor: css('--up'), downColor: css('--down'), borderVisible: false,
    wickUpColor: css('--up'), wickDownColor: css('--down'), priceLineVisible: false,
  });
  avgSeries = tickerChart.addLineSeries({ color: css('--avg'), lineWidth: 2, priceLineVisible: false, lastValueVisible: true });
  showTicker(held[0] || sold[0]);
}

function showTicker(code) {
  document.querySelectorAll('#chips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.code === code));
  const firstTrade = Object.keys(S.marks[code] || {}).sort()[0] || '';
  const days = Object.keys(S.px[code] || {}).sort();
  const from = days[Math.max(0, days.findIndex(d => d >= firstTrade) - 15)];
  candle.setData(days.filter(d => d >= from).map(d => {
    const [o, h, l, c] = S.px[code][d];
    return { time: d, open: o, high: h, low: l, close: c };
  }));
  avgSeries.setData(S.avgLine[code] || []);
  candle.setMarkers(Object.entries(S.marks[code] || {}).sort().flatMap(([d, m]) => [
    ...(m.b ? [{ time: d, position: 'belowBar', shape: 'arrowUp', color: css('--up'), text: String(m.b) }] : []),
    ...(m.s ? [{ time: d, position: 'aboveBar', shape: 'arrowDown', color: css('--down'), text: String(m.s) }] : []),
  ]));
  tickerChart.timeScale().fitContent();

  const p = S.pos[code], h = S.holdings.find(x => x.code === code);
  $('tinfo').innerHTML = h
    ? `${h.q}주 보유, 평단 ${won(h.avg)}원, 평가손익 <span class="${cls(h.pl)}">${signed(h.pl)}원</span>`
    : `전량 매도, 실현손익 <span class="${cls(p.realized)}">${signed(p.realized)}원</span>`;
}

// PIN 잠금: PIN이 맞아야 서버가 데이터를 넘겨줌
const KEY = 'assetPin';
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
};

// Apps Script API 주소 (배포 URL이 바뀌면 여기만 수정)
const API_URL = 'https://script.google.com/macros/s/AKfycbz2JbkvIgTq7EnJZfUQXBjV4__h2Ya8BmpUOrV8tiSvsqdt_9BFlUHCc7JWh3nhKlzf/exec';

async function load(pin, remember) {
  $('lock').hidden = true; $('msg').hidden = false; $('msg').textContent = '불러오는 중…';
  let res;
  try {
    // text/plain 으로 보내야 CORS 사전요청 없이 바로 통과함
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ pin }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    res = await r.json();
  } catch (e) {
    res = { ok: false, error: '서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.' };
  }
  if (!res.ok) {
    store.clear();
    $('msg').hidden = true; $('lock').hidden = false;
    $('err').textContent = res.error;
    $('pin').value = ''; $('pin').focus();
    return;
  }
  if (remember) store.set(pin); else store.clear();
  try {
    S = compute(res.data);
    $('msg').hidden = true; $('app').hidden = false;
    render(S);
  } catch (e) {
    $('msg').textContent = '계산 중 오류: ' + e.message + ' (거래 시트 형식을 확인하세요)';
  }
}

$('lock').onsubmit = ev => {
  ev.preventDefault();
  const pin = $('pin').value.trim();
  if (pin) load(pin, $('remember').checked);
};

const savedPin = store.get();
if (savedPin) load(savedPin, true); else { $('lock').hidden = false; $('pin').focus(); }
</script>
</body>
</html>
