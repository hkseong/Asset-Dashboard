<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="robots" content="noindex">
<title>Folio</title>
<!-- 아이콘: 저장소에 아래 파일을 올리면 자동 적용 (없어도 동작엔 문제 없음) -->
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1b1f27; --sub: #6b7280; --line: #e4e7ec; --soft: #eef0f3;
    --up: #e0393e; --down: #2b6fe0; --total: #1b1f27; --avg: #f29d0f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --panel: #1b1e24; --ink: #eceef2; --sub: #8b93a1; --line: #2a2e36; --soft: #252932;
      --up: #ff5a5f; --down: #4c8dff; --total: #eceef2; --avg: #ffb02e;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-feature-settings: "tnum"; -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 96px; }
  section { background: var(--panel); border-radius: 14px; padding: 18px; margin-bottom: 14px; min-width: 0; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .head .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  h2 { font-size: 15px; font-weight: 650; margin: 0; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .brand { font-size: 20px; font-weight: 750; letter-spacing: -0.02em; }

  .seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--sub); font: inherit; font-size: 13px;
    padding: 6px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .hero .label { color: var(--sub); font-size: 13px; }
  .hero .total { font-size: clamp(32px, 8vw, 44px); font-weight: 750; letter-spacing: -0.02em; margin: 4px 0 2px; }
  .hero .pl { font-size: 17px; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .stats div { font-size: 13px; color: var(--sub); }
  .stats b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; margin-top: 2px; }

  .chart { height: 300px; }
  .legend { display: flex; gap: 8px; font-size: 12px; color: var(--sub); margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
  .legend .tg {
    border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 12px;
    padding: 4px 10px; border-radius: 999px; cursor: pointer;
  }
  .legend .tg[aria-pressed="false"] { color: var(--sub); opacity: .55; text-decoration: line-through; }

  /* 종목 칩: 한 줄 가로 스크롤 */
  .chips { display: flex; gap: 6px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; margin-bottom: 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .chips.closed button { color: var(--sub); border-style: dashed; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); border-style: solid; }
  .chiprow { display: flex; align-items: center; gap: 6px; }
  .chiprow .chips { flex: 1; margin-bottom: 0; }
  .more {
    flex: none; border: 1px solid var(--line); background: var(--soft); color: var(--sub); font: inherit; font-size: 12px;
    padding: 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .more[aria-expanded="true"] { color: var(--ink); }
  #chipsClosed { margin-top: 6px; }
  .tinfo { font-size: 13px; color: var(--sub); margin: 8px 0; min-height: 18px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tinfo .nm { color: var(--ink); font-weight: 600; }
  .icon-btn { border: 0; background: none; color: var(--sub); cursor: pointer; font: inherit; font-size: 13px; padding: 2px 4px; }

  /* 보유 종목: 도넛 + 표 */
  .holdgrid { display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 720px) { .holdgrid { grid-template-columns: 1fr; } }
  .donut { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .donut svg { width: 200px; height: 200px; }
  .dlist { width: 100%; font-size: 13px; }
  .dlist .it { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; }
  .dlist .sw { width: 10px; height: 10px; border-radius: 3px; }
  .dlist .pc { font-weight: 600; }
  .dlist .etc { color: var(--sub); font-size: 12px; padding: 2px 0 4px 18px; line-height: 1.5; }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--sub); font-weight: 500; font-size: 12px; }
  td small { color: var(--sub); margin-left: 6px; font-size: 11px; }
  tbody tr { cursor: pointer; }
  .up { color: var(--up); } .down { color: var(--down); }

  .cash { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .cash div { background: var(--soft); border-radius: 10px; padding: 12px; font-size: 13px; color: var(--sub); }
  .cash b { display: block; color: var(--ink); font-size: 16px; font-weight: 600; margin-top: 3px; }
  .cash small { display: block; margin-top: 2px; }
  .note { font-size: 12px; color: var(--sub); margin-top: 10px; }
  .msg { text-align: center; color: var(--sub); padding: 80px 0; }

  /* 입력 버튼 + 시트 */
  .fab {
    position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 10;
    border: 0; border-radius: 999px; padding: 14px 20px; background: var(--ink); color: var(--panel);
    font: inherit; font-size: 15px; font-weight: 650; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  dialog {
    border: 0; padding: 0; width: min(520px, 100%); max-height: 92vh; border-radius: 18px;
    background: var(--panel); color: var(--ink);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  @media (max-width: 560px) {
    dialog { margin: auto 0 0; width: 100%; max-width: 100%; border-radius: 18px 18px 0 0; max-height: 90vh; }
  }
  .sheet { padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; max-height: 92vh; }
  .sheet .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet h3 { margin: 0; font-size: 17px; }
  .row { margin-bottom: 12px; }
  .row > label, .row > .lb { display: block; font-size: 12px; color: var(--sub); margin-bottom: 5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  input[type="text"], input[type="number"], input[type="date"], select {
    width: 100%; font: inherit; font-size: 16px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--ink); -webkit-appearance: none; appearance: none;
  }
  input:focus, select:focus { outline: 2px solid var(--ink); outline-offset: 0; }
  .newtk { background: var(--soft); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .sum { font-size: 14px; color: var(--sub); margin: 4px 0 12px; min-height: 20px; }
  .sum b { color: var(--ink); }
  .primary {
    width: 100%; border: 0; border-radius: 12px; padding: 14px; background: var(--ink); color: var(--panel);
    font: inherit; font-size: 16px; font-weight: 650; cursor: pointer;
  }
  .primary:disabled { opacity: .5; }
  .status { font-size: 13px; min-height: 18px; margin-top: 10px; }
  .status.err { color: var(--up); }
  .recent { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  .recent h4 { margin: 0 0 6px; font-size: 13px; color: var(--sub); font-weight: 500; }
  .recent .it { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .recent .it button { border: 1px solid var(--line); background: none; color: var(--up); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }

  .lock { max-width: 320px; margin: 18vh auto 0; text-align: center; }
  .lock h1 { font-size: 24px; font-weight: 750; margin: 0 0 18px; letter-spacing: -0.02em; }
  .lock input[type="password"] {
    width: 100%; font: inherit; font-size: 22px; letter-spacing: 0.4em; text-align: center;
    padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
  }
  .lock label { display: block; margin: 12px 0 16px; font-size: 13px; color: var(--sub); }
  .lock .err { color: var(--up); font-size: 13px; min-height: 18px; margin-top: 12px; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <form id="lock" class="lock" hidden>
    <h1 class="appname">Folio</h1>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
    <label><input id="remember" type="checkbox" checked> 이 기기에서 기억하기</label>
    <button type="submit" class="primary">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div id="msg" class="msg" hidden>불러오는 중…</div>

  <div id="app" hidden>
    <div class="topbar">
      <div class="brand appname">Folio</div>
      <div class="seg" id="acctSeg" role="group" aria-label="계좌"></div>
    </div>

    <section class="hero">
      <div class="label" id="asof"></div>
      <div class="total" id="total"></div>
      <div class="pl" id="pl"></div>
      <div class="stats">
        <div>매입금액<b id="cost"></b></div>
        <div>실현손익 누적<b id="realized"></b></div>
        <div>보유 종목<b id="count"></b></div>
      </div>
    </section>

    <section>
      <div class="head"><h2>투자 추이</h2><div class="seg" id="tfTotal" role="group" aria-label="투자 추이 단위"></div></div>
      <div class="chart" id="chartTotal"></div>
      <div class="legend"><span><i style="background:var(--total)"></i>평가액</span><span><i style="background:var(--sub)"></i>매입금액</span></div>
    </section>

    <section>
      <div class="head">
        <h2>종목별 차트</h2>
        <div class="tools">
          <div class="seg" id="modeSeg" role="group" aria-label="차트 형태"></div>
          <div class="seg" id="tfTicker" role="group" aria-label="종목 차트 단위"></div>
        </div>
      </div>
      <div class="chiprow">
        <div class="chips" id="chipsHeld"></div>
        <button class="more" id="closedToggle" type="button" aria-expanded="false"></button>
      </div>
      <div class="chips closed" id="chipsClosed" hidden></div>
      <div class="tinfo" id="tinfo"></div>
      <div class="chart" id="chartTicker"></div>
      <div class="legend">
        <button type="button" class="tg" id="tgAvg" aria-pressed="true"><i style="background:var(--avg)"></i>내 평단</button>
        <button type="button" class="tg" id="tgMarks" aria-pressed="true">▲▼ 매수·매도</button>
      </div>
    </section>

    <section>
      <div class="head"><h2>보유 종목</h2><div class="seg" id="pieSeg" role="group" aria-label="비중 기준"></div></div>
      <div class="holdgrid">
        <div class="donut" id="donut"></div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>종목</th><th>수량</th><th>평단</th><th>현재가</th><th>평가액</th><th>손익</th><th>수익률</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section>
      <div class="head"><h2>예수금</h2><span id="cashTotal" style="font-size:13px;color:var(--sub)"></span></div>
      <div class="cash" id="cash"></div>
      <div class="note">예수금은 투자 성과 계산에서 빠져 있습니다. 해외 달러 예수금은 달러 배당금이 거래내역에 금액 없이 찍혀서 소액 오차가 있을 수 있습니다.</div>
    </section>
  </div>
</main>

<button class="fab" id="fab" type="button" hidden>+ 거래 입력</button>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="sheet" id="tradeForm" method="dialog" novalidate>
    <div class="top"><h3 id="dlgTitle">거래 입력</h3><button type="button" class="icon-btn" id="dlgClose" aria-label="닫기">닫기</button></div>

    <div class="row"><span class="lb">구분</span><div class="seg" id="fType" role="group" aria-label="구분"></div></div>
    <div class="row"><span class="lb">계좌</span><div class="seg" id="fAcct" role="group" aria-label="계좌"></div></div>
    <div class="row"><label for="fDate">날짜 (체결일)</label><input type="date" id="fDate"></div>

    <div id="tradeFields">
      <div class="row"><label for="fCode">종목</label><select id="fCode"></select></div>
      <div class="newtk" id="newTk" hidden>
        <div class="grid2">
          <div class="row"><label for="nCode">종목코드</label><input type="text" id="nCode" placeholder="예: 360750, QQQ" autocapitalize="characters"></div>
          <div class="row"><span class="lb">통화</span><div class="seg" id="nCcy" role="group" aria-label="통화"></div></div>
        </div>
        <div class="row"><label for="nName">종목명</label><input type="text" id="nName" placeholder="예: TIGER 미국나스닥100"></div>
        <div class="row" style="margin-bottom:0"><label for="nAlias">별칭 (칩에 보일 짧은 이름, 비우면 자동)</label><input type="text" id="nAlias" placeholder="예: 나스닥100"></div>
      </div>
      <div class="grid2">
        <div class="row"><label for="fQty">수량</label><input type="number" id="fQty" inputmode="decimal" step="any" min="0"></div>
        <div class="row"><label for="fPrice" id="fPriceLb">단가</label><input type="number" id="fPrice" inputmode="decimal" step="any" min="0"></div>
      </div>
      <div class="grid2">
        <div class="row" id="fxRow"><label for="fFx">환율 (원/달러)</label><input type="number" id="fFx" inputmode="decimal" step="any" min="0"></div>
        <div class="row"><label for="fFee" id="fFeeLb">수수료</label><input type="number" id="fFee" inputmode="decimal" step="any" min="0" value="0"></div>
      </div>
    </div>

    <div id="cashFields" hidden>
      <div class="row"><label for="fAmt">금액 (원)</label><input type="number" id="fAmt" inputmode="decimal" step="any" min="0"></div>
    </div>

    <div class="sum" id="fSum"></div>
    <button type="submit" class="primary" id="fSave">저장</button>
    <div class="status" id="fStatus" role="status"></div>

    <div class="recent"><h4>최근 입력 (시트 맨 아래부터)</h4><div id="recent"></div></div>
  </form>
</dialog>

<script>
const APP_NAME = 'Folio'; // 사이트 이름 (여기만 바꾸면 됨, <title>도 같이)
document.querySelectorAll('.appname').forEach(e => e.textContent = APP_NAME);

const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const num = s => +String(s ?? '').replace(/[,$\s]/g, '') || 0;
const won = n => Math.round(n).toLocaleString('ko-KR');
const usd = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n, ccy) => ccy === 'USD' ? usd(n) : won(n) + '원';
const signed = n => (n > 0 ? '+' : '') + won(n);
const pct = n => (n > 0 ? '+' : '') + (n * 100).toFixed(2) + '%';
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : '';
const qty = q => Number.isInteger(q) ? String(q) : q.toFixed(6).replace(/0+$/, '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const EPS = 1e-9;
const FX = 'USDKRW';

// 별칭이 없으면 운용사 브랜드를 떼서 자동으로 짧게
const BRANDS = /^(TIGER|KODEX|PLUS|ACE|RISE|SOL|HANARO|KOSEF|ARIRANG|KIWOOM|1Q|TIME|KoAct|WON|BNK|파워|마이티|히어로즈|TRUSTON|UNICORN)\s+/i;
function label(code) {
  const t = S.tick[code] || {};
  if (t.alias) return t.alias;
  if (t.ccy === 'USD' && !code.startsWith('_')) return code;
  const n = String(t.name || code).replace(BRANDS, '').replace(/^미국/, '');
  return n.length > 12 ? n.slice(0, 12) + '…' : n;
}

// ───────── 계산: 거래 원장을 첫날부터 재생 ─────────
function compute(raw) {
  const tick = {};
  raw.tickers.forEach(r => { tick[String(r[0]).trim()] = { name: String(r[1]), ccy: String(r[2] || 'KRW').trim().toUpperCase(), alias: String(r[3] || '').trim() }; });

  const trades = raw.trades.map(r => ({
    d: String(r[0]).slice(0, 10), acct: String(r[1]).trim(), t: String(r[2]).trim(), code: String(r[3]).trim(),
    name: String(r[4] || ''), q: num(r[5]), p: num(r[6]), ccy: String(r[7] || 'KRW').trim().toUpperCase() || 'KRW',
    fx: num(r[8]) || 1, a: num(r[9]) || num(r[5]) * num(r[6]), fee: num(r[10]), tax: num(r[11]),
    memo: String(r[12] || ''), row: r[13],
  })).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.d) && x.t)
    .sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0); // 같은 날은 시트 행 순서 유지

  trades.forEach(x => { if (x.code && !tick[x.code]) tick[x.code] = { name: x.name || x.code, ccy: x.ccy, alias: '' }; });

  const px = {};
  raw.prices.forEach(r => { (px[String(r[1])] ??= {})[String(r[0]).slice(0, 10)] = [+r[2], +r[3], +r[4], +r[5]]; });
  const start = trades[0].d;
  const cal = [...new Set(raw.prices.map(r => String(r[0]).slice(0, 10)))].filter(d => d >= start).sort();

  const pos = {}, cash = {}, marks = {}, last = {};
  let lastFx = 0;
  const fxOn = d => { const f = px[FX]?.[d]; if (f) lastFx = f[3]; return lastFx; };
  const C = acct => cash[acct] ??= { KRW: 0, USD: 0 };

  const apply = x => {
    if (x.t === '매수' || x.t === '매도') {
      const k = x.acct + '|' + x.code;
      const p = pos[k] ??= { acct: x.acct, code: x.code, ccy: x.ccy, q: 0, costN: 0, costK: 0, realized: 0 };
      const fxT = x.ccy === 'USD' ? (x.fx > 1 ? x.fx : lastFx || 1) : 1;
      const m = ((marks[k] ??= {})[x.d] ??= { b: 0, s: 0 });
      if (x.t === '매수') {
        p.q += x.q; p.costN += x.a; p.costK += x.a * fxT; m.b += x.q;
        C(x.acct)[x.ccy] -= x.a + x.fee;
      } else {
        const r = p.q > EPS ? x.q / p.q : 0;
        const outN = p.costN * r, outK = p.costK * r;
        p.realized += (x.a - x.fee - x.tax) * fxT - outK;
        p.costN -= outN; p.costK -= outK; p.q -= x.q;
        if (p.q < 1e-7) { p.q = 0; p.costN = 0; p.costK = 0; }
        m.s += x.q;
        C(x.acct)[x.ccy] += x.a - x.fee - x.tax;
      }
    } else if (['입금', '이자', '배당', '분배금'].includes(x.t)) C(x.acct)[x.ccy] += x.a;
    else if (['출금', '세금'].includes(x.t)) C(x.acct)[x.ccy] -= x.a;
    else if (x.t === '환전') { C(x.acct).KRW -= x.a; C(x.acct).USD += x.a / x.fx; }
    else if (x.t === '재환전') { C(x.acct).KRW += x.a; C(x.acct).USD -= x.a / x.fx; }
  };

  const accts = [...new Set(trades.filter(x => x.t === '매수').map(x => x.acct))];
  const filters = ['전체', ...accts];
  const inF = (f, acct) => f === '전체' || f === acct;
  const views = Object.fromEntries(filters.map(f => [f, { series: [], avg: {} }]));

  const valueK = (p, d) => {
    const c = last[p.code];
    if (c == null) return p.costK; // 시세 없는 종목은 매입가로 평가
    return p.q * c * (p.ccy === 'USD' ? (fxOn(d) || 1) : 1);
  };

  let i = 0;
  for (const d of cal) {
    fxOn(d);
    while (i < trades.length && trades[i].d <= d) apply(trades[i++]);
    for (const c in px) if (c !== FX && px[c][d]) last[c] = px[c][d][3];
    for (const f of filters) {
      let val = 0, cost = 0;
      const agg = {};
      for (const k in pos) {
        const p = pos[k];
        if (!inF(f, p.acct)) continue;
        const a = agg[p.code] ??= { q: 0, costN: 0, seen: true };
        if (p.q > 0) { val += valueK(p, d); cost += p.costK; a.q += p.q; a.costN += p.costN; }
      }
      views[f].series.push({ time: d, val, cost });
      for (const c in agg) (views[f].avg[c] ??= []).push(agg[c].q > 0 ? { time: d, value: agg[c].costN / agg[c].q } : { time: d });
    }
  }
  while (i < trades.length) apply(trades[i++]); // 시세 마지막 날 이후 거래 반영

  // 필터별 최종 보유 현황
  const asof = cal[cal.length - 1];
  for (const f of filters) {
    const v = views[f], agg = {};
    let realized = 0;
    v.byAcct = {};
    for (const k in pos) {
      const p = pos[k];
      if (!inF(f, p.acct)) continue;
      realized += p.realized;
      const a = agg[p.code] ??= { code: p.code, ccy: p.ccy, q: 0, costN: 0, costK: 0, val: 0, accts: new Set(), marks: {} };
      a.accts.add(p.acct);
      Object.entries(marks[k] || {}).forEach(([d, m]) => {
        const t = (a.marks[d] ??= { b: 0, s: 0 }); t.b += m.b; t.s += m.s;
      });
      if (p.q > 0) { const pv = valueK(p, asof); a.q += p.q; a.costN += p.costN; a.costK += p.costK; a.val += pv; v.byAcct[p.acct] = (v.byAcct[p.acct] || 0) + pv; }
    }
    const all = Object.values(agg);
    v.holdings = all.filter(a => a.q > 0).map(a => ({
      ...a, name: tick[a.code]?.name || a.code, avgN: a.costN / a.q, price: last[a.code] ?? a.costN / a.q,
      pl: a.val - a.costK, r: (a.val - a.costK) / a.costK,
    })).sort((x, y) => y.val - x.val);
    v.closed = all.filter(a => a.q <= 0 && px[a.code]).map(a => ({ ...a, name: tick[a.code]?.name || a.code,
      realized: Object.values(pos).filter(p => p.code === a.code && inF(f, p.acct)).reduce((s, p) => s + p.realized, 0) }));
    v.realized = realized;
    v.val = v.holdings.reduce((s, h) => s + h.val, 0);
    v.cost = v.holdings.reduce((s, h) => s + h.costK, 0);
  }

  return { tick, px, views, filters, cash, asof, fx: lastFx, trades, pos };
}


// ───────── 봉 단위 묶기 ─────────
const TF = [['D', '일'], ['W', '주'], ['M', '월'], ['Y', '년']];
function bucket(d, tf) {
  if (tf === 'D') return d;
  if (tf === 'M') return d.slice(0, 7);
  if (tf === 'Y') return d.slice(0, 4);
  const dt = new Date(d + 'T00:00:00Z'); const wd = (dt.getUTCDay() + 6) % 7; // 월요일 시작
  dt.setUTCDate(dt.getUTCDate() - wd); return dt.toISOString().slice(0, 10);
}
// 같은 묶음의 첫 거래일을 봉 시간으로 사용
function groupKeys(dates, tf) {
  const first = {}; dates.forEach(d => { const b = bucket(d, tf); if (!(b in first)) first[b] = d; });
  return d => first[bucket(d, tf)];
}
function toCandles(daily, tf) { // daily: [{time,open,high,low,close}]
  if (tf === 'D') return daily;
  const key = groupKeys(daily.map(x => x.time), tf), out = [];
  daily.forEach(x => {
    const t = key(x.time), lastC = out[out.length - 1];
    if (lastC && lastC.time === t) { lastC.high = Math.max(lastC.high, x.high); lastC.low = Math.min(lastC.low, x.low); lastC.close = x.close; }
    else out.push({ ...x, time: t });
  });
  return out;
}
function toPeriodEnd(points, tf, dates) { // 선 데이터: 묶음별 마지막 값
  if (tf === 'D') return points;
  const key = groupKeys(dates || points.map(p => p.time), tf), m = new Map();
  points.forEach(p => m.set(key(p.time), { ...p, time: key(p.time) }));
  return [...m.values()];
}

// ───────── 비중 도넛 ─────────
function renderDonut() {
  seg($('pieSeg'), [['code', '종목'], ['acct', '계좌'], ['region', '국내·해외']], view.pie, k => { view.pie = k; saveView(); renderDonut(); });
  const v = S.views[view.f];
  let items;
  if (view.pie === 'acct') items = Object.entries(v.byAcct).map(([a, val]) => ({ name: a === '종합' ? '종합(해외)' : a, val }));
  else if (view.pie === 'region') {
    const g = { 국내: 0, 해외: 0 }; v.holdings.forEach(h => g[h.ccy === 'USD' ? '해외' : '국내'] += h.val);
    items = Object.entries(g).filter(([, val]) => val > 0).map(([name, val]) => ({ name, val }));
  } else items = v.holdings.map(h => ({ name: label(h.code), val: h.val }));
  const total = items.reduce((s, x) => s + x.val, 0);
  items.sort((a, b) => b.val - a.val);

  // 5% 미만이 2개 이상이면 기타로 묶음
  const small = items.filter(x => x.val / total < 0.05);
  let slices = items;
  if (small.length >= 2) {
    slices = items.filter(x => x.val / total >= 0.05);
    slices.push({ name: '기타', val: small.reduce((s, x) => s + x.val, 0), etc: small });
  }
  const R = 70, C = 2 * Math.PI * R;
  let acc = 0;
  const arcs = slices.map((s, i) => {
    const len = total ? s.val / total * C : 0;
    const color = s.etc ? css('--sub') : PALETTE[i % PALETTE.length];
    s.color = color;
    const el = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${color}" stroke-width="26"
      stroke-dasharray="${Math.max(len - 1.5, 0)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"></circle>`;
    acc += len; return el;
  }).join('');
  $('donut').innerHTML = `
    <svg viewBox="0 0 200 200" role="img" aria-label="보유 비중">
      ${total ? arcs : `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${css('--soft')}" stroke-width="26"></circle>`}
      <text x="100" y="94" text-anchor="middle" font-size="12" fill="${css('--sub')}">평가액</text>
      <text x="100" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="${css('--ink')}">${total >= 1e8 ? (total / 1e8).toFixed(2) + '억' : won(total / 1e4) + '만'}</text>
    </svg>
    <div class="dlist">${slices.map(s => `
      <div class="it"><span class="sw" style="background:${s.color}"></span><span>${esc(s.name)}</span><span class="pc">${(s.val / total * 100).toFixed(1)}%</span></div>
      ${s.etc ? `<div class="etc">${s.etc.map(x => `${esc(x.name)} ${(x.val / total * 100).toFixed(1)}%`).join(', ')}</div>` : ''}`).join('')}
    </div>`;
}

function showTicker(code) {
  if (!code) return;
  view.code = code;
  document.querySelectorAll('#chipsHeld button, #chipsClosed button').forEach(b => b.setAttribute('aria-pressed', b.dataset.code === code));
  $('tgAvg').setAttribute('aria-pressed', view.avg);
  $('tgMarks').setAttribute('aria-pressed', view.marks);
  const v = S.views[view.f];
  const h = v.holdings.find(x => x.code === code), c = v.closed.find(x => x.code === code), info = h || c;
  const ccy = info?.ccy || S.tick[code]?.ccy || 'KRW';
  tickerChart.applyOptions({ localization: { priceFormatter: p => ccy === 'USD' ? usd(p) : won(p) } });

  const mk = info?.marks || {};
  const firstTrade = Object.keys(mk).sort()[0] || '';
  const days = Object.keys(S.px[code] || {}).sort();
  const from = days[Math.max(0, days.findIndex(d => d >= firstTrade) - 15)] || days[0];
  const shown = days.filter(d => d >= from);
  const daily = shown.map(d => { const [o, hi, l, cl] = S.px[code][d]; return { time: d, open: o, high: hi, low: l, close: cl }; });
  const bars = toCandles(daily, view.tfK);
  const isCandle = view.mode === 'candle';
  candle.applyOptions({ visible: isCandle });
  closeLine.applyOptions({ visible: !isCandle });
  candle.setData(bars);
  closeLine.setData(bars.map(b => ({ time: b.time, value: b.close })));

  const key = view.tfK === 'D' ? (d => d) : groupKeys(shown, view.tfK);
  avgSeries.applyOptions({ visible: view.avg });
  avgSeries.setData(toPeriodEnd((v.avg[code] || []).filter(p => p.time >= from && S.px[code]?.[p.time]), view.tfK, shown));

  const agg = {};
  Object.entries(mk).forEach(([d, m]) => {
    const near = shown.find(x => x >= d) || shown[shown.length - 1]; // 휴장일 거래는 다음 거래일 봉에 표시
    if (!near) return;
    const t = key(near); const a = (agg[t] ??= { b: 0, s: 0 }); a.b += m.b; a.s += m.s;
  });
  const markers = !view.marks ? [] : Object.entries(agg).sort(([a], [b]) => a < b ? -1 : 1).flatMap(([t, m]) => [
    ...(m.b ? [{ time: t, position: 'belowBar', shape: 'arrowUp', color: css('--up'), text: qty(+m.b.toFixed(6)) }] : []),
    ...(m.s ? [{ time: t, position: 'aboveBar', shape: 'arrowDown', color: css('--down'), text: qty(+m.s.toFixed(6)) }] : []),
  ]);
  candle.setMarkers(isCandle ? markers : []);
  closeLine.setMarkers(isCandle ? [] : markers);
  tickerChart.timeScale().fitContent();

  const head = `<span class="nm">${esc(label(code))}</span><button type="button" class="icon-btn" id="aliasBtn" title="별칭 바꾸기">✎</button>`;
  $('tinfo').innerHTML = head + (h
    ? `${qty(h.q)}주, 평단 ${money(h.avgN, ccy)}, 평가손익 <span class="${cls(h.pl)}">${signed(h.pl)}원</span>`
    : c ? `보유하지 않음, 실현손익 <span class="${cls(c.realized)}">${signed(c.realized)}원</span>` : '');
  $('aliasBtn').onclick = async () => {
    const cur = S.tick[code]?.alias || label(code);
    const next = prompt(`${S.tick[code]?.name || code}\n칩에 보일 짧은 이름`, cur);
    if (next == null || next.trim() === cur) return;
    const res = await api({ action: 'alias', code, alias: next.trim() });
    if (!res.ok) alert(res.error);
  };
}

function heldIn(acct, code) {
  const p = S.pos[acct + '|' + code]; return p ? p.q : 0;
}

function drawForm(resetCode) {
  seg($('fType'), ['매수', '매도', '입금', '출금', '배당'].map(x => [x, x]), F.t, t => { F.t = t; drawForm(true); });
  seg($('fAcct'), ['ISA', '종합', 'CMA'].map(x => [x, x === '종합' ? '종합(해외)' : x]), F.acct, a => { F.acct = a; drawForm(true); });
  const trade = F.t === '매수' || F.t === '매도';
  $('tradeFields').hidden = !trade;
  $('cashFields').hidden = trade;
  $('fAmt').previousElementSibling.textContent = F.t === '배당' ? '금액 (원, 세후)' : '금액 (원)';

  if (trade && resetCode) {
    let codes = Object.keys(S.tick).filter(c => !c.startsWith('_'));
    if (F.t === '매도') codes = codes.filter(c => heldIn(F.acct, c) > 0);
    // 이 계좌 보유 종목 먼저, 그다음 이 계좌에서 거래했던 종목, 나머지
    const rank = c => heldIn(F.acct, c) > 0 ? 0 : S.pos[F.acct + '|' + c] ? 1 : 2;
    codes.sort((a, b) => rank(a) - rank(b) || label(a).localeCompare(label(b), 'ko'));
    $('fCode').innerHTML = codes.map(c => `<option value="${esc(c)}">${esc(label(c))}${heldIn(F.acct, c) > 0 ? ` (보유 ${qty(heldIn(F.acct, c))})` : ''}</option>`).join('')
      + (F.t === '매수' ? `<option value="${NEW}">+ 새 종목 추가</option>` : '');
    if (!codes.length && F.t === '매도') $('fCode').innerHTML = '<option value="">이 계좌에 보유 종목이 없습니다</option>';
  }
  const isNew = trade && $('fCode').value === NEW;
  $('newTk').hidden = !isNew;
  seg($('nCcy'), [['KRW', '원화'], ['USD', '달러']], F.nccy, c => { F.nccy = c; drawForm(false); });
  const ccy = isNew ? F.nccy : (S.tick[$('fCode').value]?.ccy || 'KRW');
  $('fxRow').style.visibility = ccy === 'USD' ? 'visible' : 'hidden';
  if (ccy === 'USD' && !$('fFx').value) $('fFx').value = S.fx ? S.fx.toFixed(1) : '';
  $('fPriceLb').textContent = ccy === 'USD' ? '단가 ($)' : '단가 (원)';
  $('fFeeLb').textContent = ccy === 'USD' ? '수수료 ($)' : '수수료 (원)';
  updateSum();
}

function currentCcy() {
  const code = $('fCode').value;
  return code === NEW ? F.nccy : (S.tick[code]?.ccy || 'KRW');
}

function updateSum() {
  const trade = F.t === '매수' || F.t === '매도';
  if (!trade) { const a = num($('fAmt').value); $('fSum').innerHTML = a ? `<b>${won(a)}원</b> ${F.t}` : ''; return; }
  const q = num($('fQty').value), p = num($('fPrice').value), fee = num($('fFee').value), ccy = currentCcy();
  if (!q || !p) { $('fSum').textContent = ''; return; }
  const a = q * p, fx = num($('fFx').value) || S.fx;
  const line = ccy === 'USD' ? `<b>${usd(a)}</b> (약 ${won(a * fx)}원)` : `<b>${won(a)}원</b>`;
  $('fSum').innerHTML = `${F.t} 금액 ${line}${fee ? `, 수수료 ${money(fee, ccy)}` : ''}`;
}

['fQty', 'fPrice', 'fFee', 'fFx', 'fAmt'].forEach(id => $(id).addEventListener('input', updateSum));
$('fCode').addEventListener('change', () => { $('fFx').value = ''; drawForm(false); });

$('tradeForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const st = $('fStatus'); st.className = 'status';
  const trade = F.t === '매수' || F.t === '매도';
  const t = { d: $('fDate').value, acct: F.acct, t: F.t };
  let ticker = null;
  try {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.d)) throw new Error('날짜를 입력하세요.');
    if (trade) {
      let code = $('fCode').value;
      if (!code) throw new Error('종목을 선택하세요.');
      if (code === NEW) {
        code = $('nCode').value.trim().toUpperCase();
        if (!code) throw new Error('새 종목 코드를 입력하세요.');
        if (S.tick[code]) throw new Error('이미 있는 종목입니다. 목록에서 고르세요.');
        ticker = { code, name: $('nName').value.trim() || code, alias: $('nAlias').value.trim(), ccy: F.nccy };
      }
      Object.assign(t, {
        code, name: ticker ? ticker.name : (S.tick[code]?.name || code), q: num($('fQty').value), p: num($('fPrice').value),
        ccy: ticker ? ticker.ccy : (S.tick[code]?.ccy || 'KRW'), fee: num($('fFee').value),
      });
      if (t.ccy === 'USD') t.fx = num($('fFx').value) || S.fx;
      if (t.q <= 0 || t.p <= 0) throw new Error('수량과 단가를 확인하세요.');
      if (F.t === '매도' && t.q > heldIn(F.acct, code) + 1e-7) throw new Error(`보유 수량(${qty(heldIn(F.acct, code))})보다 많이 팔 수 없습니다.`);
    } else {
      t.a = num($('fAmt').value); t.ccy = 'KRW';
      if (t.a <= 0) throw new Error('금액을 입력하세요.');
    }
  } catch (e) { st.textContent = e.message; st.className = 'status err'; return; }

  $('fSave').disabled = true; st.textContent = '저장 중…';
  const res = await api({ action: 'add', trade: t, ticker });
  $('fSave').disabled = false;
  if (!res.ok) { st.textContent = res.error; st.className = 'status err'; return; }
  st.textContent = res.message || '저장했습니다.';
  $('fQty').value = ''; $('fPrice').value = ''; $('fAmt').value = ''; $('fFee').value = '0';
  drawForm(true); renderRecent();
});

function renderRecent() {
  const rows = S.trades.filter(x => x.row).sort((a, b) => b.row - a.row).slice(0, 8);
  $('recent').innerHTML = rows.map(x => {
    const what = x.code ? `${esc(label(x.code))} ${qty(x.q)}주 × ${money(x.p, x.ccy)}` : `${won(x.a)}원`;
    return `<div class="it"><span>${x.d} · ${x.acct} · ${x.t} · ${what}${x.memo.startsWith('폼입력') ? '' : ' <small style="color:var(--sub)">(가져온 내역)</small>'}</span>
      <button type="button" data-row="${x.row}">삭제</button></div>`;
  }).join('');
  $('recent').querySelectorAll('button').forEach(b => b.onclick = async () => {
    const x = S.trades.find(y => y.row === +b.dataset.row);
    if (!x || !confirm(`${x.d} ${x.acct} ${x.t} ${x.code ? label(x.code) : ''} 거래를 시트에서 삭제할까요?`)) return;
    b.disabled = true;
    const res = await api({ action: 'delete', row: x.row, check: { d: x.d, acct: x.acct, t: x.t, code: x.code } });
    if (!res.ok) { alert(res.error); b.disabled = false; return; }
    renderRecent();
  });
}

$('fab').onclick = openForm;
$('dlgClose').onclick = () => $('dlg').close();

// ───────── API ─────────
const API_URL = 'https://script.google.com/macros/s/AKfycbz2JbkvIgTq7EnJZfUQXBjV4__h2Ya8BmpUOrV8tiSvsqdt_9BFlUHCc7JWh3nhKlzf/exec';
const KEY = 'assetPin';
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
};

async function post(body) {
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    return await r.json();
  } catch (e) {
    return { ok: false, error: '서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.' };
  }
}

// 쓰기 요청 후 최신 데이터로 화면 다시 그림
async function api(body) {
  const res = await post({ pin: PIN, ...body });
  if (res.ok && res.data) { S = compute(res.data); renderAll(); }
  return res;
}

async function load(pin, remember) {
  $('lock').hidden = true; $('msg').hidden = false; $('msg').textContent = '불러오는 중…';
  const res = await post({ pin, action: 'get' });
  if (!res.ok) {
    store.clear();
    $('msg').hidden = true; $('lock').hidden = false;
    $('err').textContent = res.error;
    $('pin').value = ''; $('pin').focus();
    return;
  }
  PIN = pin;
  if (remember) store.set(pin); else store.clear();
  try {
    S = compute(res.data);
    $('msg').hidden = true; $('app').hidden = false; $('fab').hidden = false;
    if (!chartsReady) createCharts();
    renderAll();
  } catch (e) {
    $('msg').hidden = false;
    $('msg').textContent = '계산 중 오류: ' + e.message + ' (거래 시트 형식을 확인하세요)';
    console.error(e);
  }
}

$('lock').onsubmit = ev => {
  ev.preventDefault();
  const pin = $('pin').value.trim();
  if (pin) load(pin, $('remember').checked);
};

const savedPin = store.get();
if (savedPin) load(savedPin, true); else { $('lock').hidden = false; $('pin').focus(); }
</script>
